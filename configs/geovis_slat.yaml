{
  "model": {
    "resolution": 64,
    "slat_dim": 8,
    "low_feature_dim": 64,
    "depth_temperature": 0.04,
    "occlusion_margin": 0.03,
    "minimum_incidence": 0.05,
    "classifier_free_dropout": 0.1,
    "residual_limit": 1.0
  },
  "loss": {
    "endpoint_weight": 0.25,
    "prior_weight": 0.01
  },
  "flow": {
    "sigma_min": 1e-5
  },
  "dry_run_batch": {
    "batch_size": 1,
    "num_views": 3,
    "image_size": 64,
    "active_tokens": 512,
    "slat_dim": 8
  },
  "training": {
    "stage": "vggt_affostruction_sparse_residual_slat_flow",
    "freeze_vggt": true,
    "freeze_trellis_slat_flow": true,
    "freeze_decoder": true,
    "multiview_teacher": false,
    "datasets": ["meshfleet_trellis", "objaverse_cars", "srn_cars"]
  },
  "ablation": {
    "propagation": "independent_sparse_flow_residual_on_frozen_trellis",
    "pixel_alignment": "kaolin_active_voxel_reprojection",
    "fusion": "confidence_occlusion_angle_depth_weighted"
  }
}

trellis_root: /mnt/sda/hf/MVG/Base/TRELLIS
trellis_model: microsoft/TRELLIS-image-large
vggt_root: /mnt/sda/hf/MVG/Base/vggt
vggt_pretrained: facebook/VGGT-1B
hf_cache_root: /mnt/sda/hf/.cache/huggingface/hub
meshfleet_root: /mnt/sda/hf/MVG/Base/MeshFleet
dataset_root: /mnt/sda/hf/MVG/Base/dataset/c9028d206944a33af776f1b6967a6d82af385e97
extensions_root: /mnt/sda/hf/MVG/Base/extensions
torch_hub_dir: /mnt/sda/hf/.cache/torch/hub
dinov2_repo: /mnt/sda/hf/.cache/torch/hub/facebookresearch_dinov2_main
output_dir: outputs/affostruction_ss_fp32

dataset:
  train_split: train
  min_views: 1
  max_views: 8
  image_size: 518
  use_stochastic_views: true
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  pin_memory: true

model:
  grid_resolution: 16
  classifier_free_dropout: 0.1
  fusion_mode: confidence
  use_vggt_depth: true
  use_vggt_pointmap: true
  use_confidence_weighting: true
  use_visibility_weighting: true
  use_3d_positional_encoding: true
  use_spconv_refinement: false

loss:
  use_occupancy_loss: true
  use_depth_loss: true
  use_silhouette_loss: true
  use_surface_loss: false
  surface_backend: geomloss
  lambda_cfm: 1.0
  lambda_depth: 0.1
  lambda_silhouette: 0.1
  lambda_occupancy: 0.5
  lambda_surface: 0.05
  loss_render_resolution: 64
  loss_ray_samples: 48

training:
  seed: 42
  batch_size: 1
  precision: bf16
  max_steps: 10000
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  gradient_clip_norm: 1.0
  learning_rate: 0.0001
  min_learning_rate: 0.000001
  weight_decay: 0.0
  adam_epsilon: 0.00000001
  warmup_steps: 500
  sigma_min: 0.00001
  timestep_sampling: logit_normal
  flow_backend: auto
  save_every: 100
  log_every: 10

evaluation:
  validation_split: test
  validate_every: 500
  validation_batches: 1
  validation_workers: 2
  validation_view_counts: [1, 2, 4, 6, 8]
  view_counts: [1, 2, 4, 6, 8]
  sampler_steps: [1, 5, 10, 25]
  default_sampler_steps: 5
  sampler_integrator: euler
